html,body{height:100%;margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:#1f2328}
#bar{position:absolute;z-index:1000;top:10px;left:56px;right:10px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.pill{background:#fff;border-radius:10px;padding:6px 12px;box-shadow:0 2px 8px rgba(0,0,0,.2);pointer-events:auto}
.pill b{font-size:15px}
.bar-sub{font-size:11px;opacity:.55;margin-top:1px}
#journeys{display:flex;gap:4px;padding:4px}
.jbtn{border:0;background:transparent;color:inherit;font:inherit;font-size:12px;font-weight:600;padding:4px 10px;border-radius:8px;cursor:pointer}
.jbtn[aria-pressed="true"]{background:#1f2328;color:#fff}
#map{height:100%}
.legend{background:#fff;padding:8px 12px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:13px}
.legend i{display:inline-block;width:22px;height:5px;border-radius:3px;margin-right:6px;vertical-align:middle}
.stop{width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid #1f2328;box-sizing:border-box}
.stop.t{width:14px;height:14px;border:3px solid #6b7280}
.hl .stop{background:#f59e0b;border-color:#b45309;box-shadow:0 0 0 5px rgba(245,158,11,.35)}
#stay-sel{font:inherit;font-size:12px;border:0;background:transparent;color:inherit;max-width:210px}
.lbl{background:rgba(255,255,255,.85);border:0;box-shadow:none;font-weight:700;padding:1px 5px}
.pop{width:250px}.pop .ph{height:115px;margin:-1px -1px 8px;border-radius:10px 10px 0 0;background:#eee center/cover;display:flex;align-items:center;justify-content:center;color:#888;font-size:12px}
.pop h3{margin:0}.pop .rg{color:#6b7280;font-size:12px;margin-bottom:6px}
.pop dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px}.pop dt{color:#6b7280}.pop dd{margin:0}
.pop button,.pop a{font:inherit;font-size:12px;margin:8px 6px 0 0;padding:4px 8px;border:1px solid #d0d0d0;border-radius:7px;background:#f7f7f7;color:#1f2328;cursor:pointer;text-decoration:none;display:inline-block}
.leaflet-popup-content{margin:12px 14px}
.car{position:relative;height:130px;margin:-1px -1px 8px;border-radius:10px 10px 0 0;overflow:hidden;background:#eee}
.trk{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;cursor:grab;touch-action:pan-x;-webkit-user-select:none;user-select:none}.trk::-webkit-scrollbar{display:none}.trk.dragging{cursor:grabbing;scroll-snap-type:none}
.trk img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center;-webkit-user-drag:none;user-select:none;pointer-events:none}
.pop .nv{position:absolute;top:50%;transform:translateY(-50%);margin:0;width:26px;height:26px;padding:0;border-radius:50%;background:rgba(255,255,255,.85);font-size:16px;line-height:1}
.pop .pv{left:6px}.pop .nx{right:6px}
.ct{position:absolute;bottom:6px;right:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:1px 6px;border-radius:8px}
.none{height:100%;display:flex;align-items:center;justify-content:center;color:#888;font-size:12px}
.leaflet-tooltip.leg{font-size:13px;line-height:1.4}.tt{display:block;width:190px;height:95px;object-fit:cover;border-radius:6px;margin-bottom:4px}
/* Vietnamese sits under the English text, smaller and muted. */
.vi{display:block;font-size:12px;line-height:1.3;color:#6b7280;font-weight:400}
.pop .vi{font-size:11px}
.legend .vi,#stats .vi{font-size:10.5px}
#title .vi{font-size:11px;color:#6b7280;font-weight:500}
.jbtn .vi{font-size:10px;color:#8a8a8a}
.jbtn[aria-pressed="true"] .vi{color:#d0d0d0}
</style>

<script>
(() => {
"use strict";

const markers = new Map();   // city -> L.marker for the current journey
let map = null;              // current Leaflet map instance
let J = null;                // current journey
let currentId = null;        // id of the current journey
let gen = 0;                 // bumped on every mount; stale async work is dropped

const money = v => J.currency.symbol + Math.round(v).toLocaleString(J.currency.locale);
const vndOf = v => Math.round(v * RATES[J.currency.code]).toLocaleString("vi-VN") + " ₫";
const amount = v => `${money(v)} (≈ ${vndOf(v)})`;
const dur = m => m >= 60 ? Math.floor(m / 60) + "h" + (m % 60 ? String(m % 60).padStart(2, "0") : "") : m + " min";
// English first, Vietnamese beneath it.
const bi = (en, vi) => `<span class="en">${en ?? ""}</span>${vi ? `<span class="vi">${vi}</span>` : ""}`;
const ui = key => bi(UI[key].en, UI[key].vi);

function carHTML(list) {
  return `<div class="car">${list.length
    ? `<div class="trk">${list.map(u => `<img src="${u}" alt="" onerror="tripImgFail(this)">`).join("")}</div><span class="ct">1/${list.length}</span>`
    : `<div class="none">No picture yet</div>`}</div>`;
}

// A photo that cannot load is dropped; an empty carousel falls back to the
// same empty state used when a stop has no pictures at all.
window.tripImgFail = (img) => {
  const track = img.closest(".trk");
  img.remove();
  if (!track) return;
  const car = track.closest(".car");
  const left = track.querySelectorAll("img").length;
  if (!left) {
    if (car) car.innerHTML = `<div class="none">No picture yet</div>`;
    return;
  }
  const ct = car && car.querySelector(".ct");
  if (ct) ct.textContent = "1/" + left;
};

function wireCar(d, list) {
  const trk = d.querySelector(".trk"), ct = d.querySelector(".ct");
  if (trk) {
    const idx = () => Math.round(trk.scrollLeft / trk.clientWidth);
    trk.addEventListener("scroll", () => { if (ct) ct.textContent = (idx() + 1) + "/" + list.length; }, { passive: true });
    const pv = d.querySelector(".pv"), nx = d.querySelector(".nx");
    if (pv) pv.onclick = e => { e.stopPropagation(); trk.scrollBy({ left: -trk.clientWidth, behavior: "smooth" }); };
    if (nx) nx.onclick = e => { e.stopPropagation(); trk.scrollBy({ left: trk.clientWidth, behavior: "smooth" }); };
    let drag = false, sx = 0, s0 = 0, moved = 0;
    trk.addEventListener("dragstart", e => e.preventDefault());
    trk.addEventListener("pointerdown", e => {
      if (e.pointerType !== "mouse") return;
      drag = true; moved = 0; sx = e.clientX; s0 = trk.scrollLeft;
      trk.classList.add("dragging"); try { trk.setPointerCapture(e.pointerId); } catch (_) {} e.preventDefault();
    });
    trk.addEventListener("pointermove", e => { if (!drag) return; const dx = e.clientX - sx; moved = Math.max(moved, Math.abs(dx)); trk.scrollLeft = s0 - dx; });
    const end = () => {
      if (!drag) return;
      drag = false; trk.classList.remove("dragging");
      if (moved > 6) trk.scrollTo({ left: Math.round(trk.scrollLeft / trk.clientWidth) * trk.clientWidth, behavior: "smooth" });
      moved = 0;
    };
    trk.addEventListener("pointerup", end); trk.addEventListener("pointercancel", end);
  }
  if (window.L && L.DomEvent) L.DomEvent.disableClickPropagation(d);
}

const hotel = s => {
  const en = (s.acc || "") + (s.hd ? "" : " <i>(not booked)</i>");
  const vi = (s.accVi || s.acc || "") + (s.hd ? "" : " <i>(chưa đặt)</i>");
  const label = s.accVi ? bi(en, vi) : en;
  return s.hu ? `<a class="hl" href="${s.hu}" target="_blank" rel="noopener">${label}</a>` : label;
};

function stopCard(s) {
  const d = document.createElement("div");
  d.className = "pop";
  const list = s.pics || [];
  const mode = s.t ? MODES[s.t] : null;
  const subline = s.base
    ? bi(`${UI.dayTripFrom.en} ${s.base}`, `${UI.dayTripFrom.vi} ${s.base}`)
    : bi(`${s.n} night${s.n > 1 ? "s" : ""}`, `${s.n} ${UI.nights.vi}`);
  const stayCell = s.ac > 0 ? `${hotel(s)} ${amount(s.ac)}` : bi(UI.freeStay.en, UI.freeStay.vi);
  const travel = s.t
    ? bi(
        `${s.tn || mode.en}, ${dur(s.m)}${s.tc != null ? ", " + amount(s.tc) + " " + UI.est.en : ""}`,
        `${s.tnVi || mode.vi}, ${dur(s.m)}${s.tc != null ? ", " + amount(s.tc) + " " + UI.est.vi : ""}`,
      )
    : "";
  const rows = [];
  if (!s.base) rows.push(`<dt>${ui("stay")}</dt><dd>${stayCell}</dd>`);
  rows.push(`<dt>${ui("do")}</dt><dd>${bi(s.act, s.actVi)}</dd>`);
  rows.push(`<dt>${ui("budget")}</dt><dd><b>${amount(s.b)}</b></dd>`);
  if (s.t) rows.push(`<dt>${ui(s.base ? "travel" : "next")}</dt><dd>${travel}</dd>`);
  d.innerHTML = carHTML(list) + `<h3>${bi(s.c, s.cVi)}</h3><div class="rg">${s.r} · ${subline}</div><dl>${rows.join("")}</dl>`;
  wireCar(d, list);
  return d;
}

const hov = l => {
  l.on("mouseover", () => l.setStyle({ weight: l.options.weight + 4 }));
  l.on("mouseout", () => l.setStyle({ weight: l.options.weight - 4 }));
};
const gm = (a, b) => `https://www.google.com/maps/dir/?api=1&origin=${a.ll}&destination=${b.ll}&travelmode=transit`;

const journeyIds = () => Object.keys(JOURNEYS);
function pickJourneyFromUrl() {
  const v = new URLSearchParams(location.search).get("trip");
  return journeyIds().includes(v) ? v : null;
}

const stayLabel = s => {
  const period = J.periods && J.periods[s.c];
  if (period) return [period, J.periodsVi && J.periodsVi[s.c]].filter(Boolean).join(" · ");
  return `${s.n} night${s.n > 1 ? "s" : ""} (base) · ${s.n} đêm`;
};

const legInfo = (leg, from, to, each) => ({
  tn: leg.tn || MODES[leg.t].en,
  tnVi: leg.tnVi || MODES[leg.t].vi,
  t: leg.t,
  m: leg.m,
  tc: leg.tc,
  route: from + " → " + to,
  each,
});

const legTip = (i, pics) => {
  const p = (pics || [])[0];
  const mode = MODES[i.t];
  const costEn = i.tc != null ? amount(i.tc) + " " + UI.est.en : UI.costNA.en;
  const costVi = i.tc != null ? amount(i.tc) + " " + UI.est.vi : UI.costNA.vi;
  return `${p ? `<img class="tt" src="${p}" alt="" onerror="this.remove()">` : ""}<b>${i.tn}</b><span class="vi">${i.tnVi || mode.vi}</span><br>${i.route}<br>${bi(`${mode.en} · ${dur(i.m)}${i.each ? " " + UI.eachWay.en : ""}`, `${mode.vi} · ${dur(i.m)}${i.each ? " " + UI.eachWay.vi : ""}`)}<br>${bi(costEn, costVi)}<br><i>${bi("Click for details and pictures", "Bấm để xem chi tiết và ảnh")}</i>`;
};

function legCard(i, pics, gurl) {
  const d = document.createElement("div");
  d.className = "pop";
  const list = pics || [];
  const mode = MODES[i.t];
  const rows = [
    `<dt>${ui("type")}</dt><dd>${bi(mode.en, mode.vi)}</dd>`,
    `<dt>${ui("time")}</dt><dd>${bi(dur(i.m) + (i.each ? " " + UI.eachWay.en : ""), dur(i.m) + (i.each ? " " + UI.eachWay.vi : ""))}</dd>`,
    `<dt>${ui("cost")}</dt><dd>${i.tc != null ? bi(amount(i.tc) + " " + UI.est.en, amount(i.tc) + " " + UI.est.vi) : bi(UI.costNA.en, UI.costNA.vi)}</dd>`,
  ];
  d.innerHTML = carHTML(list) + `<h3>${i.tn}</h3><div class="rg">${i.tnVi || mode.vi}</div><dl>${rows.join("")}</dl><a href="${gurl}" target="_blank" rel="noopener">${bi(UI.googleMaps.en, UI.googleMaps.vi)}</a>`;
  wireCar(d, list);
  return d;
}

function attach(poly, info, pics, gurl) {
  poly.bindTooltip(() => legTip(info, pics), { sticky: true, className: "leg" });
  poly.bindPopup(() => legCard(info, pics, gurl), { maxWidth: 280 });
  hov(poly);
}

function routePoints(a, b, rk) {
  const key = rk || (a.c + ">" + b.c);
  return J.rail[key] || J.fallbacks[key] || [a.ll, b.ll];
}

async function upgradeRoute(poly, a, b, at) {
  const key = `osrm:${currentId}:${a.c}>${b.c}`;
  let pts = null;
  try { const cached = localStorage.getItem(key); if (cached) pts = JSON.parse(cached); } catch (_) { /* storage unavailable */ }
  if (!pts) {
    try {
      const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${a.ll[1]},${a.ll[0]};${b.ll[1]},${b.ll[0]}?overview=full&geometries=geojson`);
      const j = await r.json();
      pts = j.routes[0].geometry.coordinates.map(p => [p[1], p[0]]);
      try { localStorage.setItem(key, JSON.stringify(pts)); } catch (_) { /* storage unavailable */ }
    } catch (_) { return; }
  }
  if (at !== gen || !map || !poly._map) return;
  poly.setLatLngs(pts);
}

function drawLeg(a, b, { dashed = false, rk = null, pics = [], each = false } = {}) {
  // A stop carries its onward mode (t); a day trip carries its own.
  const mode = dashed ? b.t : a.t;
  const info = legInfo(dashed ? b : a, a.c, b.c, each);
  const key = rk || (a.c + ">" + b.c);
  const rail = J.rail[key];
  const known = rail || J.fallbacks[key];
  const family = MODES[mode] ? FAMILIES[MODES[mode].family] : null;
  const poly = L.polyline(known || [a.ll, b.ll], {
    color: family ? family.color : "#888",
    weight: dashed ? 4 : 6,
    opacity: .9,
    dashArray: dashed ? "8 8" : null,
  }).addTo(map);
  attach(poly, info, pics, gm(a, b));
  // Only a hand-drawn rail shape is final; a fallback is replaced by the real road.
  if (!rail) upgradeRoute(poly, a, b, gen);
  return poly;
}

function mountJourney(id) {
  if (!JOURNEYS[id]) return null;
  gen++;
  markers.clear();
  if (map) { map.remove(); map = null; }
  J = JOURNEYS[id];
  currentId = id;

  document.title = J.title;
  document.getElementById("title").innerHTML = J.titleVi && J.titleVi !== J.title ? bi(J.title, J.titleVi) : J.title;
  document.getElementById("sub").innerHTML = J.subVi && J.subVi !== J.sub ? bi(J.sub, J.subVi) : (J.sub || "");

  map = L.map("map", { zoomControl: true });

  const layers = {};
  for (const name of J.baseLayers) {
    const def = TILES[name];
    layers[def.name] = L.tileLayer(def.url, def.options);
  }
  layers[TILES[J.defaultBase].name].addTo(map);
  L.control.layers(layers, null, { position: "topright" }).addTo(map);

  const all = J.stops.concat(J.trips);
  for (const s of all) {
    const dayTrip = !!s.base;
    const mk = L.marker(s.ll, {
      icon: L.divIcon({ className: "", html: `<div class="stop ${dayTrip ? "t" : ""}"></div>`, iconSize: dayTrip ? [14, 14] : [20, 20] }),
    }).addTo(map);
    markers.set(s.c, mk);
    mk.bindPopup(() => stopCard(s), { maxWidth: 280, autoPan: true });
    mk.bindTooltip(s.c, { permanent: true, direction: "right", offset: [dayTrip ? 8 : 12, 0], className: "lbl" });
    mk.on("mouseover", () => mk.openPopup());
  }

  const psel = document.getElementById("stay-sel");
  psel.innerHTML = "";
  const entries = J.stops.map(s => [s.c, stayLabel(s)]);
  if (J.staySelector === "stops+trips") for (const t of J.trips) entries.push([t.c, "day trip from " + t.base]);
  for (const [city, sub] of entries) {
    const o = document.createElement("option");
    o.value = city;
    o.textContent = city + " · " + sub;
    psel.appendChild(o);
  }
  psel.onchange = () => {
    for (const mk of markers.values()) mk.getElement()?.classList.remove("hl");
    const s = all.find(x => x.c === psel.value);
    if (s && markers.has(s.c)) {
      const mk = markers.get(s.c);
      mk.getElement()?.classList.add("hl");
      mk.openPopup();
      map.panTo(s.ll);
    }
  };

  const nights = J.stops.reduce((a, s) => a + s.n, 0);
  const budget = all.reduce((a, s) => a + s.b, 0);
  const transit = J.stops.reduce((a, s) => a + s.m, 0);
  const transport = J.stops.reduce((a, s) => a + (s.tc || 0), 0) + 2 * J.trips.reduce((a, s) => a + (s.tc || 0), 0);
  document.getElementById("stats").innerHTML = bi(
    `${nights} nights · ${amount(budget)} ${UI.totalBudget.en} · ${dur(transit)} ${UI.inTransit.en} · ~${amount(transport)} ${UI.transport.en}`,
    `${nights} đêm · ${amount(budget)} ${UI.totalBudget.vi} · ${dur(transit)} ${UI.inTransit.vi} · ~${amount(transport)} ${UI.transport.vi}`,
  );

  const lg = L.control({ position: "bottomleft" });
  lg.onAdd = () => {
    const d = L.DomUtil.create("div", "legend");
    const used = [...new Set(all.filter(s => s.t).map(s => MODES[s.t].family))]
      .sort((x, y) => Object.keys(FAMILIES).indexOf(x) - Object.keys(FAMILIES).indexOf(y));
    d.innerHTML = used
      .map(f => `<div><i style="background:${FAMILIES[f].color}"></i>${bi(FAMILIES[f].en, FAMILIES[f].vi)}</div>`).join("") +
      `<div style="margin-top:4px">${bi(UI.legendHint.en, UI.legendHint.vi)}</div>` +
      `<div style="margin-top:4px;color:#9aa0a6;font-size:10.5px">${bi(
        `${UI.rates.en} ${RATES.asOf}: 1 € = ${RATES.EUR.toLocaleString("vi-VN")} ₫ · 1 JP¥ = ${RATES.JPY} ₫ · 1 CN¥ = ${RATES.CNY.toLocaleString("vi-VN")} ₫`,
        `${UI.rates.vi} ${RATES.asOf}: 1 € = ${RATES.EUR.toLocaleString("vi-VN")} ₫ · 1 JP¥ = ${RATES.JPY} ₫ · 1 CN¥ = ${RATES.CNY.toLocaleString("vi-VN")} ₫`,
      )}</div>`;
    return d;
  };
  lg.addTo(map);

  const pts = J.map.fitInclude === "stops+trips" ? all : J.stops;
  map.fitBounds(L.latLngBounds(pts.map(s => s.ll)).pad(.15));

  const at = gen;
  for (let i = 0; i < J.stops.length - 1; i++) {
    drawLeg(J.stops[i], J.stops[i + 1], { pics: J.stops[i + 1].pics });
  }
  for (const t of J.trips) {
    const base = J.stops.find(s => s.c === t.base);
    if (!base) continue;
    drawLeg(base, t, { dashed: true, rk: t.rk || null, pics: t.pics, each: true });
  }
  void at;

  return map;
}

function readStoredJourney() {
  try { return localStorage.getItem("tripmap_journey"); } catch (_) { return null; }
}

function setJourney(id, { writeUrl = true } = {}) {
  if (!JOURNEYS[id]) return;
  try { localStorage.setItem("tripmap_journey", id); } catch (_) { /* storage unavailable */ }
  mountJourney(id);
  for (const btn of document.querySelectorAll("#journeys button")) {
    btn.setAttribute("aria-pressed", String(btn.dataset.journey === id));
  }
  if (writeUrl) history.replaceState(null, "", "?trip=" + id);
}

function initToggle() {
  const host = document.getElementById("journeys");
  host.innerHTML = "";
  document.getElementById("stay-label").innerHTML = `${bi("Stay", "Chỗ ở")}<select id="stay-sel"></select>`;
  for (const id of journeyIds()) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "jbtn";
    btn.dataset.journey = id;
    btn.innerHTML = bi(JOURNEYS[id].label, JOURNEYS[id].labelVi);
    btn.setAttribute("aria-pressed", "false");
    btn.addEventListener("click", () => setJourney(id));
    host.appendChild(btn);
  }
}

function bootJourney() {
  const fromUrl = pickJourneyFromUrl();
  const stored = readStoredJourney();
  if (fromUrl) return fromUrl;
  if (stored && JOURNEYS[stored]) return stored;
  return "japan";
}

initToggle();
setJourney(bootJourney());
})();
</script>
